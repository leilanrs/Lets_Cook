<div data-name="signup" class="page no-navbar 
 no-toolbar">
    <div class="page-content login-screen-content">
        <div class="login-screen-title">Create Account</div>
        <form>
            <div class="list">
                <ul>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Name</div>
                            <div class="item-input-wrap">
                                <input type="text" autofocus="" name="name" id="name" placeholder="Your name">
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Email</div>
                            <div class="item-input-wrap">
                                <input type="email" autofocus="" name="email" id="email" placeholder="Your email">
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Username</div>
                            <div class="item-input-wrap">
                                <input type="text" autofocus="" name="uname" id="uname"
                                    placeholder="Your username">
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Password</div>
                            <div class="item-input-wrap">
                                <input type="password" name="pwd" id="pwd" placeholder="Your password">
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="list">
                <ul>
                    <li><a href="#" class="item-link list-button" id="btnsignup">Sign Up</a></li>
                </ul>
                <div class="block-footer">
                    <p>Already have a account? <a href="/login" class="link back">Sign in</a></p>
                </div>
            </div>

        </form>
    </div>
</div>
