<div class="page" data-name="editrecipe">
    <div class="navbar">
        <div class="navbar-inner">
            <div class="navbar-bg bg-color-teal"></div>
            <div class="left">
                <a href="#" class="back link icon-only">
                    <i class="icon icon-back color-white"></i>
                </a>
            </div>
            <div class="title text-color-white">Edit Recipe</div>
        </div>
    </div>
    <div class="page-content">
        <form method="POST" class="form-ajax-submit">
            <div class="list no-hairlines-md">
                <ul>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Title</div>
                            <div class="item-input-wrap">
                                <input id="tx_title" type="text"  required />
                                <span class="input-clear-button"></span>
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Description</div>
                            <div class="item-input-wrap">
                                <textarea id="tx_description" 
                                    rows="4"></textarea>
                                <span class="input-clear-button"></span>
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Cooking Time</div>
                            <div class="item-input-wrap">
                                <input id="tx_cooktime" type="text"  required />
                                <span class="input-clear-button"></span>
                            </div>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-label">Difficulty</div>
                            <div class="item-input-wrap">
                                <ul id="ul_difficulty"></ul>

                                <select placeholder="add difficulty level" id="sel_difficulty">

                                </select>
                            </div>
                        </div>
                    </li>
                    <div class="block-title">Ingredients</div>
                    <div class="item-inner">
                        <ul id="ul_ingredient">
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="icon demo-list-icon" id="no_bahan">1</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-input-wrap">
                                        <input type="text" placeholder="Ingredient 1" id="ingredient_1"
                                            name="ingredient[]" />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <button class="col button button-outline border-color-gray" name="btnaddbahan"
                                id="btnaddbahan"><i class="icon f7-icons">plus </i> Add ingredients</button>
                        </div>
                    </li>
                    <div class="block-title">Steps</div>
                    <div class="item-inner">
                        <ul id="ul_step">
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="icon demo-list-icon" id="no_step">1</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-input-wrap">
                                        <textarea class="resizable" placeholder="step 1" id="step_1"
                                            name="steps[]"></textarea>
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <button class="col button button-outline border-color-gray" name="btnaddstep"
                                id="btnaddstep"><i class="icon f7-icons">plus </i> Add Step</button>
                        </div>
                    </li>
                    <li class="item-content item-input">
                        <div class="item-inner">
                            <div class="item-title item-floating-label">Images</div>
                            <div class="item-input-wrap">
                                <input id="tx_gambar" type="text" placeholder="input link image" required />
                                <span class="input-clear-button"></span>
                            </div>
                        </div>
                    </li>

                    <li class="item-content item-input">
                        <div class="item-inner">
                            <input type="button" name="btnsubmit" id="btnsubmit" class="button button-fill 
					button-big" value="SUBMIT">
                        </div>
                    </li>


                </ul>
            </div>
        </form>

    </div>
</div>
